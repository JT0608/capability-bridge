[project]
name = "capability-bridge"
version = "0.1.0"
description = "A transport-agnostic model capability bridge. MCP is the first transport; Vision is the first capability."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "fastmcp>=2.0",
]

[project.scripts]
capability-bridge = "capability_bridge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["src/capability_bridge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
